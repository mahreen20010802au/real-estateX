<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Tour - EstateX</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">Estate<span>X</span></a>
        <input type="checkbox" id="nav-toggle">
        <label for="nav-toggle" class="hamburger">&#9776;</label>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="properties.html">Properties</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="schedule-tour.html" class="active btn-nav">Schedule Tour</a></li>
        </ul>
    </header>

    <div class="container" style="max-width: 650px;">
        <div class="glass-card">
            <h2>Schedule a On-Site Tour</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Book your private property visit with a
                certified agent.</p>

            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label>Select Property</label>
                    <select class="form-control">
                        <option>Grand Horizon Villa</option>
                        <option>Beachfront Resort Estate</option>
                        <option>Royal Marble Mansion</option>
                        <option>Skyline Luxury Penthouse</option>
                        <option>Glass Tower Plaza</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Tour Type</label><br>
                    <input type="radio" name="tour" checked> In-Person Visit &nbsp;&nbsp;
                    <input type="radio" name="tour"> Live Video Call
                </div>

                <div class="form-group">
                    <label>Special Requests</label>
                    <textarea class="form-control" rows="4" placeholder="Mention any extra preferences..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Confirm Booking</button>
            </form>
        </div>
    </div>

    <a href="https://wa.me/923000000000" class="whatsapp-widget" target="_blank">&#128172;</a>

    <footer>
        <p>&copy; 2026 EstateX Property Portal. </p>

    </footer>

</body>

</html>
